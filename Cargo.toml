[package]
name = "meld"
version = "0.2.2"
edition = "2021"
description = "Local, reversible, account-aware sync for Claude Code desktop sessions"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
notify = "6"
sha2 = "0.10"
filetime = "0.2"
anyhow = "1"
thiserror = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
