# Meld config — copy to ~/.meld/config.toml (or run `meld config init`)

# Parent directory containing one folder per Claude account
sessions_root = "/Users/YOU/Library/Application Support/Claude/claude-code-sessions"

# Where meld keeps its manifest, backups and lock file
state_dir = "/Users/YOU/.meld"

# File-watcher debounce in milliseconds
debounce_ms = 1500

# Keep at most this many snapshots (oldest pruned first). Sync snapshots
# hold only the files a sync replaced or deleted, so they are small.
max_snapshots = 200

# Full snapshots (`meld backup`, copy-only syncs) copy every account tree and
# are big, so they have their own smaller cap.
max_full_snapshots = 10

# Basenames to ignore everywhere
ignore = [".DS_Store"]

# What happens to a chat you delete (see README):
#   "come_back"         (default) it comes back from the other accounts
#   "stay_deleted_here" stays deleted in the account/org you deleted it in
#   "delete_everywhere" deleted in every account and organization
deleted_chats = "come_back"

# On by default: the edited version of a conversation replaces older copies in
# other accounts (replaced copies are backed up). false = keep both as a conflict
propagate_updates = true
